<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Trust Bank Admin - Support Inbox</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@400,0..1&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body {
    overflow-x: hidden;
    max-width: 100vw;
    margin: 0;
    padding: 0;
  }
  *, *::before, *::after {
    box-sizing: border-box;
  }
</style>
<link rel="manifest" href="manifest.json">
</head>
<body class="bg-slate-100 h-screen flex flex-col font-['Manrope'] antialiased">

<!-- Fixed Top Header -->
<header class="bg-slate-900 text-white p-3.5 sm:p-4 flex items-center justify-between shadow-md flex-shrink-0 z-20 border-b border-slate-800">
  <div class="flex items-center gap-3 min-w-0">
    <a href="admin.html" class="p-1 hover:bg-white/10 rounded-lg transition flex items-center justify-center flex-shrink-0" aria-label="Back to Admin Control Panel">
      <span class="material-symbols-outlined text-white text-[22px] notranslate" translate="no">arrow_back</span>
    </a>
    <div class="min-w-0">
      <h1 class="text-base sm:text-lg font-bold leading-tight truncate">Admin: Support Inbox</h1>
      <p class="text-[11px] text-slate-400 truncate mt-0.5">Two-way isolated client messaging</p>
    </div>
  </div>
  <div class="flex items-center gap-2 flex-shrink-0">
    <button type="button" id="clear-convo-btn" class="px-3 py-1.5 bg-red-600/20 hover:bg-red-600/30 text-red-300 border border-red-500/30 text-xs font-bold rounded-lg transition flex items-center gap-1">
      <span class="material-symbols-outlined text-[16px] notranslate" translate="no">delete</span>
      <span id="clear-convo-label" class="hidden xs:inline">Clear Chat (Account 1)</span>
    </button>
  </div>
</header>

<!-- Account Conversation Switcher -->
<div class="bg-slate-800 p-2 sm:px-4 flex items-center justify-between gap-2 shadow-inner flex-shrink-0 z-10 border-b border-slate-700">
  <div class="flex items-center gap-2 w-full max-w-xl mx-auto">
    <button id="btn-chat-acc1" type="button" class="flex-1 py-2 px-3 rounded-xl text-xs sm:text-sm font-bold transition flex items-center justify-center gap-2 bg-blue-600 text-white shadow-sm">
      <span class="w-2.5 h-2.5 rounded-full bg-white flex-shrink-0"></span>
      <span class="truncate" id="tab-acc1-title">Account 1 (Alex)</span>
      <span id="badge-count-acc1" class="hidden px-1.5 py-0.2 bg-white/20 text-white text-[10px] rounded-full">0</span>
    </button>
    <button id="btn-chat-acc2" type="button" class="flex-1 py-2 px-3 rounded-xl text-xs sm:text-sm font-bold transition flex items-center justify-center gap-2 bg-slate-700 hover:bg-slate-600 text-slate-300">
      <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 flex-shrink-0"></span>
      <span class="truncate" id="tab-acc2-title">Account 2 (Jordan)</span>
      <span id="badge-count-acc2" class="hidden px-1.5 py-0.2 bg-white/20 text-white text-[10px] rounded-full">0</span>
    </button>
  </div>
</div>

<!-- Active Customer Status Banner -->
<div class="bg-white border-b border-slate-200 px-4 py-2 flex items-center justify-between gap-3 flex-shrink-0">
  <div class="flex items-center gap-2.5 min-w-0">
    <div id="active-user-avatar" class="w-8 h-8 rounded-full bg-primary text-white flex items-center justify-center font-bold text-xs flex-shrink-0 overflow-hidden">
      <span class="material-symbols-outlined text-[18px] notranslate" translate="no">person</span>
    </div>
    <div class="min-w-0">
      <div class="flex items-center gap-1.5">
        <span class="font-bold text-xs sm:text-sm text-slate-900 truncate" id="active-user-name">Alex Morgan</span>
        <span class="text-[10px] font-bold px-1.5 py-0.2 rounded bg-blue-100 text-blue-800" id="active-user-badge">Account 1</span>
      </div>
      <p class="text-[11px] text-slate-500 font-mono truncate" id="active-user-email">@trustbank25</p>
    </div>
  </div>
  <div class="flex items-center gap-1 text-[11px] text-emerald-600 font-semibold flex-shrink-0">
    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
    <span>Active Channel</span>
  </div>
</div>

<!-- Chat Messages Scroll Area -->
<main class="flex-1 overflow-y-auto p-4 sm:p-6 flex flex-col gap-3 min-w-0" id="chat-box">
  <div class="text-center text-slate-400 my-8 text-sm italic">Loading conversation...</div>
</main>

<!-- Bottom Reply Form with Image Support -->
<footer class="bg-white border-t border-slate-200 flex flex-col shadow-sm flex-shrink-0 z-20">
  <!-- Selected Image Preview Bar -->
  <div id="image-preview-container" class="hidden bg-slate-100 border-b border-slate-200 p-2.5 px-4 flex items-center justify-between gap-3">
    <div class="flex items-center gap-3 min-w-0">
      <div class="relative w-12 h-12 rounded-lg overflow-hidden border border-slate-300 shadow-sm flex-shrink-0 bg-slate-200">
        <img id="image-preview-img" src="" class="w-full h-full object-cover" alt="Image preview">
      </div>
      <div class="min-w-0">
        <p class="text-xs font-bold text-slate-800 truncate" id="image-preview-name">Photo selected</p>
        <p class="text-[11px] text-slate-500 font-medium">Ready to send</p>
      </div>
    </div>
    <button type="button" id="remove-image-btn" class="p-1 text-slate-400 hover:text-red-500 rounded-lg hover:bg-white transition flex items-center justify-center" title="Remove photo">
      <span class="material-symbols-outlined text-[20px] notranslate" translate="no">close</span>
    </button>
  </div>

  <!-- Input controls row -->
  <div class="p-3 sm:p-4 flex items-center gap-2">
    <!-- Image upload trigger icon -->
    <label for="chat-image-input" class="cursor-pointer text-slate-500 hover:text-slate-900 hover:bg-slate-100 active:scale-95 rounded-full w-10 h-10 flex items-center justify-center transition flex-shrink-0" title="Attach an image">
      <span class="material-symbols-outlined text-[24px] notranslate" translate="no">add_photo_alternate</span>
      <input type="file" id="chat-image-input" accept="image/*" class="hidden">
    </label>

    <input type="text" id="chat-input" class="flex-1 bg-slate-100 border border-slate-200 rounded-full px-4 py-2.5 text-sm focus:outline-none focus:border-slate-800 focus:bg-white transition" placeholder="Type a reply to customer...">

    <button id="send-btn" class="bg-slate-900 hover:bg-slate-800 active:scale-95 text-white rounded-full w-10 h-10 flex items-center justify-center shadow transition flex-shrink-0 disabled:opacity-50 disabled:pointer-events-none" aria-label="Send reply">
      <span class="material-symbols-outlined notranslate text-[20px]" translate="no">send</span>
    </button>
  </div>
</footer>

<!-- Lightbox Modal for Full Image View -->
<div id="image-lightbox-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4">
  <div class="relative max-w-4xl max-h-[90vh] flex flex-col items-center">
    <div class="absolute -top-11 right-0 flex items-center gap-2">
      <a id="lightbox-download-link" href="#" target="_blank" download="chat-image.jpg" class="text-white hover:text-blue-300 p-1.5 rounded-full bg-black/40 hover:bg-black/60 transition flex items-center justify-center" title="Open full / download">
        <span class="material-symbols-outlined text-[22px] notranslate" translate="no">download</span>
      </a>
      <button type="button" id="lightbox-close-btn" class="text-white hover:text-red-400 p-1.5 rounded-full bg-black/40 hover:bg-black/60 transition flex items-center justify-center" title="Close">
        <span class="material-symbols-outlined text-[24px] notranslate" translate="no">close</span>
      </button>
    </div>
    <img id="lightbox-img" src="" class="max-w-full max-h-[85vh] object-contain rounded-lg shadow-2xl" alt="Enlarged photo">
  </div>
</div>

<script type="module">
  import { addMessage, getMessages, clearMessages, getAllAccounts, listenToDatabaseChanges, markMessagesAsSeen, compressImage } from './app.js';

  let selectedAccountId = 'account1';
  let cachedAccounts = {};
  let selectedImageDataUrl = null;
  let isSending = false;

  const box = document.getElementById('chat-box');
  const input = document.getElementById('chat-input');
  const sendBtn = document.getElementById('send-btn');
  const imageInput = document.getElementById('chat-image-input');
  const imagePreviewContainer = document.getElementById('image-preview-container');
  const imagePreviewImg = document.getElementById('image-preview-img');
  const imagePreviewName = document.getElementById('image-preview-name');
  const removeImageBtn = document.getElementById('remove-image-btn');

  const tabAcc1 = document.getElementById('btn-chat-acc1');
  const tabAcc2 = document.getElementById('btn-chat-acc2');
  const clearBtn = document.getElementById('clear-convo-btn');

  const activeUserName = document.getElementById('active-user-name');
  const activeUserEmail = document.getElementById('active-user-email');
  const activeUserBadge = document.getElementById('active-user-badge');
  const activeUserAvatar = document.getElementById('active-user-avatar');

  // Lightbox elements
  const lightboxModal = document.getElementById('image-lightbox-modal');
  const lightboxImg = document.getElementById('lightbox-img');
  const lightboxCloseBtn = document.getElementById('lightbox-close-btn');
  const lightboxDownloadLink = document.getElementById('lightbox-download-link');

  window.openChatImageModal = function(src) {
    if (!src) return;
    lightboxImg.src = src;
    lightboxDownloadLink.href = src;
    lightboxModal.classList.remove('hidden');
    lightboxModal.classList.add('flex');
  };

  function closeLightbox() {
    lightboxModal.classList.add('hidden');
    lightboxModal.classList.remove('flex');
    lightboxImg.src = '';
  }

  lightboxCloseBtn.addEventListener('click', closeLightbox);
  lightboxModal.addEventListener('click', (e) => {
    if (e.target === lightboxModal) closeLightbox();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !lightboxModal.classList.contains('hidden')) {
      closeLightbox();
    }
  });

  function updateTabButtons() {
    if (selectedAccountId === 'account1') {
      tabAcc1.className = 'flex-1 py-2 px-3 rounded-xl text-xs sm:text-sm font-bold transition flex items-center justify-center gap-2 bg-blue-600 text-white shadow-sm';
      tabAcc2.className = 'flex-1 py-2 px-3 rounded-xl text-xs sm:text-sm font-bold transition flex items-center justify-center gap-2 bg-slate-700 hover:bg-slate-600 text-slate-300';
    } else {
      tabAcc1.className = 'flex-1 py-2 px-3 rounded-xl text-xs sm:text-sm font-bold transition flex items-center justify-center gap-2 bg-slate-700 hover:bg-slate-600 text-slate-300';
      tabAcc2.className = 'flex-1 py-2 px-3 rounded-xl text-xs sm:text-sm font-bold transition flex items-center justify-center gap-2 bg-emerald-600 text-white shadow-sm';
    }
  }

  function updateCustomerInfo() {
    const acc = cachedAccounts[selectedAccountId] || {};
    const isAcc1 = selectedAccountId === 'account1';
    const name = acc.profile?.name || (isAcc1 ? 'Alex Morgan' : 'Jordan Taylor');
    const email = acc.email || (isAcc1 ? '@trustbank25' : '@trustbank26');

    activeUserName.textContent = name;
    activeUserEmail.textContent = email;
    activeUserBadge.textContent = isAcc1 ? 'Account 1' : 'Account 2';
    activeUserBadge.className = isAcc1
      ? 'text-[10px] font-bold px-1.5 py-0.2 rounded bg-blue-100 text-blue-800'
      : 'text-[10px] font-bold px-1.5 py-0.2 rounded bg-emerald-100 text-emerald-800';

    if (acc.profile?.avatar) {
      activeUserAvatar.innerHTML = `<img src="${acc.profile.avatar}" class="w-full h-full object-cover rounded-full">`;
    } else {
      activeUserAvatar.innerHTML = `<span class="material-symbols-outlined text-[18px] notranslate" translate="no">person</span>`;
    }

    input.placeholder = `Type a reply to ${name.split(' ')[0]}...`;
  }

  function renderMessages(messages) {
    box.innerHTML = '';
    
    if (!messages || messages.length === 0) {
      box.innerHTML = `
        <div class="flex flex-col items-center justify-center my-auto py-12 text-center">
          <div class="w-12 h-12 rounded-xl bg-slate-200 text-slate-500 flex items-center justify-center mb-2">
            <span class="material-symbols-outlined text-[28px] notranslate" translate="no">chat_bubble_outline</span>
          </div>
          <p class="text-sm font-semibold text-slate-600">No messages yet with ${activeUserName.textContent}.</p>
          <p class="text-xs text-slate-400 mt-0.5">Send a message or photo below to begin this customer support thread.</p>
        </div>
      `;
      return;
    }

    messages.forEach(m => {
      const isAdmin = m.sender === 'Admin';
      const alignClass = isAdmin ? 'self-end bg-slate-900 text-white' : 'self-start bg-white text-slate-800 border border-slate-200';
      const radiusClass = isAdmin ? 'rounded-2xl rounded-tr-sm' : 'rounded-2xl rounded-tl-sm';
      
      const el = document.createElement('div');
      el.className = `max-w-[85%] sm:max-w-[70%] px-4 py-2.5 ${radiusClass} ${alignClass} shadow-sm break-words`;

      // Status indicator (Seen / Delivered) for Admin's sent messages
      let statusHtml = '';
      if (isAdmin) {
        if (m.seen) {
          statusHtml = `
            <span class="inline-flex items-center gap-1 font-semibold text-slate-300" title="Seen by Customer">
              <span>${m.time || ''}</span>
              <span class="material-symbols-outlined text-[13px] text-blue-400 notranslate" translate="no">done_all</span>
              <span class="text-blue-300 font-bold">Seen</span>
            </span>
          `;
        } else {
          statusHtml = `
            <span class="inline-flex items-center gap-1 text-slate-400" title="Delivered">
              <span>${m.time || ''}</span>
              <span class="material-symbols-outlined text-[13px] notranslate" translate="no">check</span>
              <span>Delivered</span>
            </span>
          `;
        }
      } else {
        statusHtml = `<span class="text-slate-400">${m.time || ''}</span>`;
      }

      // Image rendering if message contains a photo
      let imageHtml = '';
      if (m.image) {
        imageHtml = `
          <div class="mb-2 rounded-xl overflow-hidden cursor-pointer group relative shadow-sm border border-black/10 bg-black/5" onclick="window.openChatImageModal('${m.image}')">
            <img src="${m.image}" class="w-full max-h-64 object-cover rounded-xl transition duration-150 group-hover:scale-[1.01]" alt="Attached image" loading="lazy">
            <div class="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition flex items-center justify-center text-white pointer-events-none">
              <span class="material-symbols-outlined text-[26px] drop-shadow notranslate" translate="no">zoom_in</span>
            </div>
          </div>
        `;
      }

      const textHtml = m.text ? `<p class="text-sm leading-relaxed whitespace-pre-wrap">${m.text}</p>` : '';

      el.innerHTML = `
        <div class="text-[11px] font-bold mb-1 ${isAdmin ? 'text-slate-300' : 'text-blue-700'}">${m.sender}</div>
        ${imageHtml}
        ${textHtml}
        <div class="text-[10px] text-right mt-1.5 flex items-center justify-end gap-1.5">
          ${statusHtml}
        </div>
      `;
      box.appendChild(el);
    });
    
    box.scrollTop = box.scrollHeight;
  }

  // Mark customer messages as viewed by admin
  async function checkAndMarkSeen(messages) {
    if (!messages || !Array.isArray(messages)) return;
    const hasUnseenCustomerMsg = messages.some(m => m.sender !== 'Admin' && !m.seen);
    if (hasUnseenCustomerMsg) {
      await markMessagesAsSeen(selectedAccountId, 'admin');
    }
  }

  async function selectAccount(accKey) {
    selectedAccountId = accKey;
    updateTabButtons();
    updateCustomerInfo();
    const clearLabel = document.getElementById('clear-convo-label');
    if (clearLabel) {
      clearLabel.textContent = `Clear Chat (${accKey === 'account2' ? 'Account 2' : 'Account 1'})`;
    }
    const msgs = await getMessages(accKey);
    renderMessages(msgs);
    await checkAndMarkSeen(msgs);
  }

  tabAcc1.addEventListener('click', () => selectAccount('account1'));
  tabAcc2.addEventListener('click', () => selectAccount('account2'));

  // Image selection handler
  imageInput.addEventListener('change', async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;

    try {
      // Compress image to ensure lightweight payload (< 50KB) and prevent Firestore document limits
      selectedImageDataUrl = await compressImage(file, 800, 800, 0.75);
      imagePreviewImg.src = selectedImageDataUrl;
      imagePreviewName.textContent = file.name || 'Photo selected';
      imagePreviewContainer.classList.remove('hidden');
      input.focus();
    } catch (err) {
      console.error('Image compression failed:', err);
      alert('Could not attach this image. Please select a valid photo file.');
      clearImageSelection();
    }
  });

  function clearImageSelection() {
    selectedImageDataUrl = null;
    imageInput.value = '';
    imagePreviewImg.src = '';
    imagePreviewContainer.classList.add('hidden');
  }

  removeImageBtn.addEventListener('click', clearImageSelection);

  async function pushAdminReply() {
    if (isSending) return;
    const text = input.value.trim();
    const image = selectedImageDataUrl;

    if (!text && !image) return;

    isSending = true;
    sendBtn.disabled = true;

    const timestamp = new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    const newMsgObj = {
      id: `msg_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
      sender: 'Admin',
      text: text,
      image: image || null,
      time: timestamp,
      timestamp: Date.now(),
      seen: false
    };

    input.value = '';
    clearImageSelection();

    try {
      await addMessage(newMsgObj, selectedAccountId);
      const msgs = await getMessages(selectedAccountId);
      renderMessages(msgs);
    } catch (err) {
      console.error('Failed to send admin reply:', err);
      alert('Reply could not be sent. Please check your connection and try again.');
      if (text) input.value = text;
    } finally {
      isSending = false;
      sendBtn.disabled = false;
      input.focus();
    }
  }

  sendBtn.addEventListener('click', pushAdminReply);
  input.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') pushAdminReply();
  });

  clearBtn.addEventListener('click', async () => {
    const name = activeUserName.textContent;
    const isAcc1 = selectedAccountId === 'account1';
    const accLabel = isAcc1 ? 'Account 1' : 'Account 2';
    if (confirm(`Clear conversation with ${name} (${accLabel}) only?\n\nThe other account's chat will NOT be deleted.`)) {
      await clearMessages(selectedAccountId);
      renderMessages([]);
    }
  });

  async function loadInitial() {
    cachedAccounts = await getAllAccounts();
    const acc1 = cachedAccounts.account1 || {};
    const acc2 = cachedAccounts.account2 || {};

    document.getElementById('tab-acc1-title').textContent = `Account 1 (${(acc1.profile?.name || 'Alex').split(' ')[0]})`;
    document.getElementById('tab-acc2-title').textContent = `Account 2 (${(acc2.profile?.name || 'Jordan').split(' ')[0]})`;

    updateCustomerInfo();
    const clearLabel = document.getElementById('clear-convo-label');
    if (clearLabel) {
      clearLabel.textContent = `Clear Chat (${selectedAccountId === 'account2' ? 'Account 2' : 'Account 1'})`;
    }
    const msgs = await getMessages(selectedAccountId);
    renderMessages(msgs);
    await checkAndMarkSeen(msgs);
  }

  // Real-time listener
  listenToDatabaseChanges(async (dbData) => {
    if (!dbData) return;
    if (dbData.accounts) {
      cachedAccounts = dbData.accounts;
      const targetAcc = dbData.accounts[selectedAccountId];
      const accMsgs = Array.isArray(targetAcc?.messages)
        ? targetAcc.messages
        : (selectedAccountId === 'account1' && Array.isArray(dbData.tb_messages) ? dbData.tb_messages : []);
      renderMessages(accMsgs);
      await checkAndMarkSeen(accMsgs);
    }
  });

  // When tab becomes visible again, ensure unread messages are marked seen
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'visible') {
      const msgs = await getMessages(selectedAccountId);
      await checkAndMarkSeen(msgs);
    }
  });
  window.addEventListener('focus', async () => {
    const msgs = await getMessages(selectedAccountId);
    await checkAndMarkSeen(msgs);
  });

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', loadInitial);
  } else {
    loadInitial();
  }
</script>

<!-- Moveable Translation Widget -->
<script src="translate.js"></script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(err => {
        console.log('ServiceWorker registration error: ', err);
      });
    });
  }
</script>

</body>
</html>
