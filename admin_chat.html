<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@400,0..1&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>

<link rel="manifest" href="manifest.json">
</head>
<body class="bg-gray-50 h-screen flex flex-col font-['Manrope']">
<header class="bg-blue-900 text-white p-4 flex items-center justify-between shadow">
  <div class="flex items-center gap-2">
    <a href="admin.html" class="material-symbols-outlined text-white hover:text-gray-200">arrow_back</a>
    <h1 class="text-xl font-bold">Admin: Support Inbox</h1>
  </div>
</header>
<main class="flex-1 overflow-y-auto p-4 flex flex-col gap-4" id="chat-box">
  <!-- Messages will appear here -->
</main>
<footer class="bg-white p-4 border-t flex items-center gap-2">
  <input type="text" id="chat-input" class="flex-1 bg-gray-100 border-none rounded-full px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Type a reply...">
  <button id="send-btn" class="bg-blue-800 text-white rounded-full w-10 h-10 flex items-center justify-center hover:bg-blue-900">
    <span class="material-symbols-outlined">send</span>
  </button>
</footer>

<script type="module">
  import { addMessage, getMessages, listenToDatabaseChanges } from './app.js';

  async function renderMessages(messages) {
    const box = document.getElementById('chat-box');
    const msgs = messages || await getMessages();
    box.innerHTML = '';
    
    if (msgs.length === 0) {
      box.innerHTML = '<div class="text-center text-gray-500 my-4 text-sm">No messages yet.</div>';
    }

    msgs.forEach(m => {
      const isAdmin = m.sender === 'Admin';
      const alignClass = isAdmin ? 'self-end bg-blue-800 text-white' : 'self-start bg-gray-200 text-gray-800';
      const radiusClass = isAdmin ? 'rounded-tl-xl rounded-bl-xl rounded-tr-xl' : 'rounded-tr-xl rounded-br-xl rounded-tl-xl';
      
      const el = document.createElement('div');
      el.className = `max-w-[75%] px-4 py-2 ${radiusClass} ${alignClass}`;
      el.innerHTML = `
        <div class="text-sm font-semibold mb-1 opacity-70">${m.sender}</div>
        <p>${m.text}</p>
        <div class="text-xs text-right mt-1 opacity-70">${m.time}</div>
      `;
      box.appendChild(el);
    });
    
    box.scrollTop = box.scrollHeight;
  }

  document.getElementById('send-btn').addEventListener('click', async () => {
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if(text) {
      await addMessage({ sender: 'Admin', text, time: new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) });
      input.value = '';
      await renderMessages();
    }
  });

  document.getElementById('chat-input').addEventListener('keypress', (e) => {
    if(e.key === 'Enter') document.getElementById('send-btn').click();
  });

  listenToDatabaseChanges(data => renderMessages(data?.tb_messages || []));
  renderMessages();
</script>

<div id="google_translate_element" style="position:fixed; bottom:20px; right:20px; z-index:9999;"></div>


<!-- Google Translate Logic and Initialize Function -->
<script type="text/javascript">
    function googleTranslateElementInit() {
        new google.translate.TranslateElement({
            pageLanguage: 'en', 
            layout: google.translate.TranslateElement.InlineLayout.SIMPLE
        }, 'google_translate_element');
    }
</script>
<script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>


<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').then(registration => {
        console.log('ServiceWorker registration successful');
      }).catch(err => {
        console.log('ServiceWorker registration failed: ', err);
      });
    });
  }
</script>

</body>
</html>
