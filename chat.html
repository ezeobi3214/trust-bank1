<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Trust Bank - Support</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@400,0..1&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body {
    overflow-x: hidden;
    max-width: 100vw;
    margin: 0;
    padding: 0;
  }
  *, *::before, *::after {
    box-sizing: border-box;
  }
</style>
<link rel="manifest" href="manifest.json">
</head>
<body class="bg-slate-100 h-screen flex flex-col font-['Manrope'] antialiased">

<!-- Fixed Top Header -->
<header class="bg-blue-700 text-white p-3.5 sm:p-4 flex items-center justify-between shadow-md flex-shrink-0 z-20">
  <div class="flex items-center gap-3 min-w-0">
    <a href="dashboard.html" class="p-1 hover:bg-white/10 rounded-lg transition flex items-center justify-center flex-shrink-0" aria-label="Back to dashboard">
      <span class="material-symbols-outlined text-white text-[22px] notranslate" translate="no">arrow_back</span>
    </a>
    <div class="min-w-0">
      <h1 class="text-base sm:text-lg font-bold leading-tight truncate">Customer Care</h1>
      <p class="text-xs text-blue-200 truncate mt-0.5" id="chat-user-label">Connected as User</p>
    </div>
  </div>
  <div class="flex items-center gap-2 flex-shrink-0">
    <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
    <span class="text-xs font-semibold text-blue-100 hidden sm:inline">Support Online</span>
  </div>
</header>

<!-- Chat Messages Scroll Area -->
<main class="flex-1 overflow-y-auto p-4 sm:p-6 flex flex-col gap-3 min-w-0" id="chat-box">
  <div class="text-center text-slate-400 my-8 text-sm italic">Connecting to support channel...</div>
</main>

<!-- Bottom Reply Form -->
<footer class="bg-white p-3 sm:p-4 border-t border-slate-200 flex items-center gap-2 shadow-sm flex-shrink-0 z-20">
  <input type="text" id="chat-input" class="flex-1 bg-slate-100 border border-slate-200 rounded-full px-4 py-2.5 text-sm focus:outline-none focus:border-blue-500 focus:bg-white transition" placeholder="Type a message to customer support...">
  <button id="send-btn" class="bg-blue-600 hover:bg-blue-700 active:scale-95 text-white rounded-full w-10 h-10 flex items-center justify-center shadow transition flex-shrink-0" aria-label="Send message">
    <span class="material-symbols-outlined notranslate text-[20px]" translate="no">send</span>
  </button>
</footer>

<script type="module">
  import { addMessage, getMessages, listenToDatabaseChanges, getProfile, getCurrentAccountId } from './app.js';

  const box = document.getElementById('chat-box');
  const input = document.getElementById('chat-input');
  const sendBtn = document.getElementById('send-btn');
  const userLabel = document.getElementById('chat-user-label');
  const currentAccountId = getCurrentAccountId();

  let activeUserName = currentAccountId === 'account2' ? 'Jordan Taylor' : 'Alex Morgan';

  async function initUser() {
    try {
      const profile = await getProfile(currentAccountId);
      if (profile && profile.name) {
        activeUserName = profile.name;
      }
    } catch (_) {}
    if (userLabel) {
      userLabel.textContent = `Connected as ${activeUserName} (${currentAccountId === 'account2' ? 'Account 2' : 'Account 1'})`;
    }
  }

  function renderMessages(messages) {
    box.innerHTML = '';
    
    if (!messages || messages.length === 0) {
      box.innerHTML = `
        <div class="flex flex-col items-center justify-center my-auto py-12 text-center">
          <div class="w-14 h-14 rounded-2xl bg-blue-100 text-blue-600 flex items-center justify-center mb-3">
            <span class="material-symbols-outlined text-[32px] notranslate" translate="no">support_agent</span>
          </div>
          <h3 class="text-base font-bold text-slate-800">Hello, ${activeUserName}!</h3>
          <p class="text-xs text-slate-500 max-w-xs mt-1">How can we assist you with your Trust Bank account today? Send us a message and an agent will reply shortly.</p>
        </div>
      `;
      return;
    }

    messages.forEach(m => {
      const isAdmin = m.sender === 'Admin';
      const isUser = !isAdmin;
      const alignClass = isUser ? 'self-end bg-blue-600 text-white' : 'self-start bg-white text-slate-800 border border-slate-200';
      const radiusClass = isUser ? 'rounded-2xl rounded-tr-sm' : 'rounded-2xl rounded-tl-sm';
      
      const el = document.createElement('div');
      el.className = `max-w-[85%] sm:max-w-[70%] px-4 py-2.5 ${radiusClass} ${alignClass} shadow-sm break-words`;
      el.innerHTML = `
        <div class="text-[11px] font-bold mb-1 ${isUser ? 'text-blue-200' : 'text-blue-700'}">${m.sender}</div>
        <p class="text-sm leading-relaxed whitespace-pre-wrap">${m.text}</p>
        <div class="text-[10px] text-right mt-1.5 ${isUser ? 'text-blue-200' : 'text-slate-400'}">${m.time}</div>
      `;
      box.appendChild(el);
    });
    
    box.scrollTop = box.scrollHeight;
  }

  async function loadChat() {
    await initUser();
    const msgs = await getMessages(currentAccountId);
    renderMessages(msgs);
  }

  // Real-time synchronization strictly for this account
  listenToDatabaseChanges((dbData) => {
    if (!dbData) return;
    const accountMsgs = dbData.accounts?.[currentAccountId]?.messages 
      || (currentAccountId === 'account1' ? dbData.tb_messages : []) 
      || [];
    renderMessages(accountMsgs);
  });

  async function pushMessage() {
    const text = input.value.trim();
    if (text) {
      const timestamp = new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
      const newMsgObj = {
        sender: activeUserName,
        text: text,
        time: timestamp
      };
      
      input.value = '';
      await addMessage(newMsgObj, currentAccountId);
    }
  }

  sendBtn.addEventListener('click', pushMessage);
  input.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') pushMessage();
  });

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', loadChat);
  } else {
    loadChat();
  }
</script>

<!-- Moveable Translation Widget -->
<script src="translate.js"></script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(err => {
        console.log('ServiceWorker registration error: ', err);
      });
    });
  }
</script>

</body>
</html>
