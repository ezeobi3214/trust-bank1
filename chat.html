<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Trust Bank - Support</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@400,0..1&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body {
    overflow-x: hidden;
    max-width: 100vw;
    margin: 0;
    padding: 0;
  }
  *, *::before, *::after {
    box-sizing: border-box;
  }
</style>
<link rel="manifest" href="manifest.json">
</head>
<body class="bg-slate-100 h-screen flex flex-col font-['Manrope'] antialiased">

<!-- Fixed Top Header -->
<header class="bg-blue-700 text-white p-3.5 sm:p-4 flex items-center justify-between shadow-md flex-shrink-0 z-20">
  <div class="flex items-center gap-3 min-w-0">
    <a href="dashboard.html" class="p-1 hover:bg-white/10 rounded-lg transition flex items-center justify-center flex-shrink-0" aria-label="Back to dashboard">
      <span class="material-symbols-outlined text-white text-[22px] notranslate" translate="no">arrow_back</span>
    </a>
    <div class="min-w-0">
      <h1 class="text-base sm:text-lg font-bold leading-tight truncate">Customer Care</h1>
      <p class="text-xs text-blue-200 truncate mt-0.5" id="chat-user-label">Connected as User</p>
    </div>
  </div>
  <div class="flex items-center gap-2 flex-shrink-0">
    <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
    <span class="text-xs font-semibold text-blue-100 hidden sm:inline">Support Online</span>
  </div>
</header>

<!-- Chat Messages Scroll Area -->
<main class="flex-1 overflow-y-auto p-4 sm:p-6 flex flex-col gap-3 min-w-0" id="chat-box">
  <div class="text-center text-slate-400 my-8 text-sm italic">Connecting to support channel...</div>
</main>

<!-- Bottom Reply Form with Image Support -->
<footer class="bg-white border-t border-slate-200 flex flex-col shadow-sm flex-shrink-0 z-20">
  <!-- Selected Image Preview Bar -->
  <div id="image-preview-container" class="hidden bg-blue-50/70 border-b border-blue-100 p-2.5 px-4 flex items-center justify-between gap-3">
    <div class="flex items-center gap-3 min-w-0">
      <div class="relative w-12 h-12 rounded-lg overflow-hidden border border-blue-200 shadow-sm flex-shrink-0 bg-slate-200">
        <img id="image-preview-img" src="" class="w-full h-full object-cover" alt="Image preview">
      </div>
      <div class="min-w-0">
        <p class="text-xs font-bold text-slate-800 truncate" id="image-preview-name">Photo selected</p>
        <p class="text-[11px] text-blue-600 font-medium">Ready to send</p>
      </div>
    </div>
    <button type="button" id="remove-image-btn" class="p-1 text-slate-400 hover:text-red-500 rounded-lg hover:bg-white/80 transition flex items-center justify-center" title="Remove photo">
      <span class="material-symbols-outlined text-[20px] notranslate" translate="no">close</span>
    </button>
  </div>

  <!-- Input controls row -->
  <div class="p-3 sm:p-4 flex items-center gap-2">
    <!-- Image upload trigger icon -->
    <label for="chat-image-input" class="cursor-pointer text-slate-500 hover:text-blue-600 hover:bg-blue-50 active:scale-95 rounded-full w-10 h-10 flex items-center justify-center transition flex-shrink-0" title="Attach an image">
      <span class="material-symbols-outlined text-[24px] notranslate" translate="no">add_photo_alternate</span>
      <input type="file" id="chat-image-input" accept="image/*" class="hidden">
    </label>

    <input type="text" id="chat-input" class="flex-1 bg-slate-100 border border-slate-200 rounded-full px-4 py-2.5 text-sm focus:outline-none focus:border-blue-500 focus:bg-white transition" placeholder="Type a message to customer support...">

    <button id="send-btn" class="bg-blue-600 hover:bg-blue-700 active:scale-95 text-white rounded-full w-10 h-10 flex items-center justify-center shadow transition flex-shrink-0 disabled:opacity-50 disabled:pointer-events-none" aria-label="Send message">
      <span class="material-symbols-outlined notranslate text-[20px]" translate="no">send</span>
    </button>
  </div>
</footer>

<!-- Lightbox Modal for Full Image View -->
<div id="image-lightbox-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4">
  <div class="relative max-w-4xl max-h-[90vh] flex flex-col items-center">
    <div class="absolute -top-11 right-0 flex items-center gap-2">
      <a id="lightbox-download-link" href="#" target="_blank" download="chat-image.jpg" class="text-white hover:text-blue-300 p-1.5 rounded-full bg-black/40 hover:bg-black/60 transition flex items-center justify-center" title="Open full / download">
        <span class="material-symbols-outlined text-[22px] notranslate" translate="no">download</span>
      </a>
      <button type="button" id="lightbox-close-btn" class="text-white hover:text-red-400 p-1.5 rounded-full bg-black/40 hover:bg-black/60 transition flex items-center justify-center" title="Close">
        <span class="material-symbols-outlined text-[24px] notranslate" translate="no">close</span>
      </button>
    </div>
    <img id="lightbox-img" src="" class="max-w-full max-h-[85vh] object-contain rounded-lg shadow-2xl" alt="Enlarged photo">
  </div>
</div>

<script type="module">
  import { addMessage, getMessages, listenToDatabaseChanges, getProfile, getCurrentAccountId, markMessagesAsSeen, compressImage } from './app.js';

  const box = document.getElementById('chat-box');
  const input = document.getElementById('chat-input');
  const sendBtn = document.getElementById('send-btn');
  const imageInput = document.getElementById('chat-image-input');
  const imagePreviewContainer = document.getElementById('image-preview-container');
  const imagePreviewImg = document.getElementById('image-preview-img');
  const imagePreviewName = document.getElementById('image-preview-name');
  const removeImageBtn = document.getElementById('remove-image-btn');
  const userLabel = document.getElementById('chat-user-label');

  // Lightbox
  const lightboxModal = document.getElementById('image-lightbox-modal');
  const lightboxImg = document.getElementById('lightbox-img');
  const lightboxCloseBtn = document.getElementById('lightbox-close-btn');
  const lightboxDownloadLink = document.getElementById('lightbox-download-link');

  const currentAccountId = getCurrentAccountId();
  let activeUserName = currentAccountId === 'account2' ? 'Jordan Taylor' : 'Alex Morgan';
  let selectedImageDataUrl = null;
  let isSending = false;

  window.openChatImageModal = function(src) {
    if (!src) return;
    lightboxImg.src = src;
    lightboxDownloadLink.href = src;
    lightboxModal.classList.remove('hidden');
    lightboxModal.classList.add('flex');
  };

  function closeLightbox() {
    lightboxModal.classList.add('hidden');
    lightboxModal.classList.remove('flex');
    lightboxImg.src = '';
  }

  lightboxCloseBtn.addEventListener('click', closeLightbox);
  lightboxModal.addEventListener('click', (e) => {
    if (e.target === lightboxModal) closeLightbox();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !lightboxModal.classList.contains('hidden')) {
      closeLightbox();
    }
  });

  async function initUser() {
    try {
      const profile = await getProfile(currentAccountId);
      if (profile && profile.name) {
        activeUserName = profile.name;
      }
    } catch (_) {}
    if (userLabel) {
      userLabel.textContent = `Connected as ${activeUserName} (${currentAccountId === 'account2' ? 'Account 2' : 'Account 1'})`;
    }
  }

  function renderMessages(messages) {
    box.innerHTML = '';
    
    if (!messages || messages.length === 0) {
      box.innerHTML = `
        <div class="flex flex-col items-center justify-center my-auto py-12 text-center">
          <div class="w-14 h-14 rounded-2xl bg-blue-100 text-blue-600 flex items-center justify-center mb-3">
            <span class="material-symbols-outlined text-[32px] notranslate" translate="no">support_agent</span>
          </div>
          <h3 class="text-base font-bold text-slate-800">Hello, ${activeUserName}!</h3>
          <p class="text-xs text-slate-500 max-w-xs mt-1">How can we assist you with your Trust Bank account today? Send us a message or photo and an agent will reply shortly.</p>
        </div>
      `;
      return;
    }

    messages.forEach(m => {
      const isAdmin = m.sender === 'Admin';
      const isUser = !isAdmin;
      const alignClass = isUser ? 'self-end bg-blue-600 text-white' : 'self-start bg-white text-slate-800 border border-slate-200';
      const radiusClass = isUser ? 'rounded-2xl rounded-tr-sm' : 'rounded-2xl rounded-tl-sm';
      
      const el = document.createElement('div');
      el.className = `max-w-[85%] sm:max-w-[70%] px-4 py-2.5 ${radiusClass} ${alignClass} shadow-sm break-words`;

      // Status indicator (Seen / Delivered) for customer's sent messages
      let statusHtml = '';
      if (isUser) {
        if (m.seen) {
          statusHtml = `
            <span class="inline-flex items-center gap-1 font-semibold text-blue-200" title="Seen by Support">
              <span>${m.time || ''}</span>
              <span class="material-symbols-outlined text-[13px] text-emerald-300 notranslate" translate="no">done_all</span>
              <span class="text-emerald-200 font-bold">Seen</span>
            </span>
          `;
        } else {
          statusHtml = `
            <span class="inline-flex items-center gap-1 text-blue-200/90" title="Delivered">
              <span>${m.time || ''}</span>
              <span class="material-symbols-outlined text-[13px] notranslate" translate="no">check</span>
              <span>Delivered</span>
            </span>
          `;
        }
      } else {
        statusHtml = `<span class="text-slate-400">${m.time || ''}</span>`;
      }

      // Image rendering if message contains a photo
      let imageHtml = '';
      if (m.image) {
        imageHtml = `
          <div class="mb-2 rounded-xl overflow-hidden cursor-pointer group relative shadow-sm border border-black/10 bg-black/5" onclick="window.openChatImageModal('${m.image}')">
            <img src="${m.image}" class="w-full max-h-64 object-cover rounded-xl transition duration-150 group-hover:scale-[1.01]" alt="Attached image" loading="lazy">
            <div class="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition flex items-center justify-center text-white pointer-events-none">
              <span class="material-symbols-outlined text-[26px] drop-shadow notranslate" translate="no">zoom_in</span>
            </div>
          </div>
        `;
      }

      const textHtml = m.text ? `<p class="text-sm leading-relaxed whitespace-pre-wrap">${m.text}</p>` : '';

      el.innerHTML = `
        <div class="text-[11px] font-bold mb-1 ${isUser ? 'text-blue-200' : 'text-blue-700'}">${m.sender}</div>
        ${imageHtml}
        ${textHtml}
        <div class="text-[10px] text-right mt-1.5 flex items-center justify-end gap-1.5">
          ${statusHtml}
        </div>
      `;
      box.appendChild(el);
    });
    
    box.scrollTop = box.scrollHeight;
  }

  // Mark admin messages as viewed by customer
  async function checkAndMarkSeen(messages) {
    if (!messages || !Array.isArray(messages)) return;
    const hasUnseenAdminMsg = messages.some(m => m.sender === 'Admin' && !m.seen);
    if (hasUnseenAdminMsg) {
      await markMessagesAsSeen(currentAccountId, 'customer');
    }
  }

  async function loadChat() {
    await initUser();
    const msgs = await getMessages(currentAccountId);
    renderMessages(msgs);
    await checkAndMarkSeen(msgs);
  }

  // Real-time synchronization strictly for this account
  listenToDatabaseChanges(async (dbData) => {
    if (!dbData) return;
    const currentAcc = dbData.accounts?.[currentAccountId];
    const accountMsgs = Array.isArray(currentAcc?.messages)
      ? currentAcc.messages
      : (currentAccountId === 'account1' && Array.isArray(dbData.tb_messages) ? dbData.tb_messages : []);
    renderMessages(accountMsgs);
    await checkAndMarkSeen(accountMsgs);
  });

  // When tab becomes visible again, ensure unread messages are marked seen
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'visible') {
      const msgs = await getMessages(currentAccountId);
      await checkAndMarkSeen(msgs);
    }
  });
  window.addEventListener('focus', async () => {
    const msgs = await getMessages(currentAccountId);
    await checkAndMarkSeen(msgs);
  });

  // Image selection handler
  imageInput.addEventListener('change', async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;

    try {
      // Compress image to ensure lightweight payload (< 50KB) and prevent Firestore document limits
      selectedImageDataUrl = await compressImage(file, 800, 800, 0.75);
      imagePreviewImg.src = selectedImageDataUrl;
      imagePreviewName.textContent = file.name || 'Photo selected';
      imagePreviewContainer.classList.remove('hidden');
      input.focus();
    } catch (err) {
      console.error('Image compression failed:', err);
      alert('Could not attach this image. Please select a valid photo file.');
      clearImageSelection();
    }
  });

  function clearImageSelection() {
    selectedImageDataUrl = null;
    imageInput.value = '';
    imagePreviewImg.src = '';
    imagePreviewContainer.classList.add('hidden');
  }

  removeImageBtn.addEventListener('click', clearImageSelection);

  async function pushMessage() {
    if (isSending) return;
    const text = input.value.trim();
    const image = selectedImageDataUrl;

    if (!text && !image) return;

    isSending = true;
    sendBtn.disabled = true;

    const timestamp = new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    const newMsgObj = {
      id: `msg_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
      sender: activeUserName,
      text: text,
      image: image || null,
      time: timestamp,
      timestamp: Date.now(),
      seen: false
    };

    // Clear input & image selection immediately for crisp responsive feel
    input.value = '';
    clearImageSelection();

    try {
      await addMessage(newMsgObj, currentAccountId);
      // Immediately refresh messages locally so user sees their message instantly
      const msgs = await getMessages(currentAccountId);
      renderMessages(msgs);
    } catch (err) {
      console.error('Failed to send message:', err);
      alert('Message could not be sent. Please check your connection and try again.');
      // Restore text if failed
      if (text) input.value = text;
    } finally {
      isSending = false;
      sendBtn.disabled = false;
      input.focus();
    }
  }

  sendBtn.addEventListener('click', pushMessage);
  input.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') pushMessage();
  });

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', loadChat);
  } else {
    loadChat();
  }
</script>

<!-- Moveable Translation Widget -->
<script src="translate.js"></script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(err => {
        console.log('ServiceWorker registration error: ', err);
      });
    });
  }
</script>

</body>
</html>
