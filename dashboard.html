<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<style>@layer base{html,body{margin:0;padding:0;}body{overscroll-behavior:none;}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style>
<script src="https://cdn.tailwindcss.com"></script>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          "tertiary": "#525557", "surface-container": "#e9edff", "secondary": "#006c49", "on-primary-fixed": "#00174b", "on-tertiary-container": "#eff0f2", "on-primary-fixed-variant": "#003ea8", "secondary-container": "#6cf8bb", "surface-container-high": "#e1e8fd", "on-secondary-fixed-variant": "#005236", "surface": "#f9f9ff", "on-surface-variant": "#434655", "on-secondary-container": "#00714d", "tertiary-fixed-dim": "#c5c6c8", "on-surface": "#141b2b", "on-tertiary": "#ffffff", "surface-bright": "#f9f9ff", "outline-variant": "#c3c6d7", "primary": "#004ac6", "background": "#f9f9ff", "on-background": "#141b2b", "surface-dim": "#d3daef", "on-primary": "#ffffff", "on-secondary-fixed": "#002113", "primary-fixed-dim": "#b4c5ff", "on-error": "#ffffff", "surface-container-low": "#f1f3ff", "primary-container": "#2563eb", "error-container": "#ffdad6", "tertiary-fixed": "#e1e2e4", "outline": "#737686", "surface-container-lowest": "#ffffff", "inverse-primary": "#b4c5ff", "secondary-fixed-dim": "#4edea3", "tertiary-container": "#6b6d6f", "inverse-on-surface": "#edf0ff", "surface-container-highest": "#dce2f7", "on-secondary": "#ffffff", "primary-fixed": "#dbe1ff", "secondary-fixed": "#6ffbbe", "surface-variant": "#dce2f7", "error": "#ba1a1a", "on-primary-container": "#eeefff", "on-tertiary-fixed": "#191c1e", "on-tertiary-fixed-variant": "#444749", "surface-tint": "#0053db", "on-error-container": "#93000a", "inverse-surface": "#293040"
        },
        fontFamily: {
          "body-md": ["Manrope"], "headline-lg": ["Manrope"], "display-hero": ["Manrope"], "label-md": ["Manrope"], "body-lg": ["Manrope"], "tabular-balance": ["Manrope"], "headline-sm": ["Manrope"]
        }
      }
    }
  };
</script>
</head>
<body class="bg-surface font-body-md text-body-md text-on-surface antialiased">
<header class="fixed top-0 w-full z-50 bg-surface-container-lowest/90 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]">
  <div class="h-20 max-w-[1200px] mx-auto px-margin-mobile lg:px-margin flex items-center justify-between gap-space-lg">
    <div class="flex items-center gap-space-xl">
      <a class="flex items-center gap-space-sm group" href="dashboard.html">
        <div class="w-9 h-9 rounded-lg bg-primary-container flex items-center justify-center">
          <span class="material-symbols-outlined text-on-primary text-[22px]">account_balance</span>
        </div>
        <span class="font-headline-sm text-headline-sm text-on-surface tracking-tight font-semibold">Trust Bank</span>
      </a>
      <nav class="hidden lg:flex items-center gap-space-xs">
        <a aria-current="page" class="px-space-md py-space-sm rounded-lg transition-colors bg-surface-container-low text-on-surface font-semibold" href="dashboard.html">Dashboard</a>
        <a class="px-space-md py-space-sm rounded-lg font-label-md text-label-md text-on-surface-variant hover:text-on-surface hover:bg-surface-container-low transition-colors" href="transfer.html">Transfers</a>
      </nav>
    </div>
    <div class="flex items-center gap-space-md">
      <div class="flex items-center gap-space-sm pl-space-xs">
        <div class="hidden md:flex flex-col text-right">
          <span class="font-label-md text-label-md text-on-surface font-semibold leading-tight" id="header-name">Loading...</span>
          <span class="font-label-sm text-label-sm text-outline leading-tight" id="header-account">Checking ••----</span>
        </div>
        <a href="profile.html" class="w-8 h-8 rounded-full bg-primary flex items-center justify-center shadow-[0_1px_4px_rgba(0,0,0,0.06)] cursor-pointer">
          <span class="material-symbols-outlined text-on-primary text-[18px]">person</span>
        </a>
        <a href="index.html" class="ml-2 text-sm text-primary underline">Logout</a>
      </div>
    </div>
  </div>
</header>

<main class="w-full pt-20 bg-surface min-h-screen">
  <div class="flex flex-col w-full">
    <div class="max-w-[1200px] w-full mx-auto px-margin-mobile lg:px-margin py-space-xl flex flex-col gap-space-xl">
      <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-space-md">
        <div>
          <span class="font-label-sm text-label-sm text-outline uppercase tracking-wider">Dashboard Overview</span>
          <h1 class="font-display-hero text-headline-lg lg:text-display-hero text-on-surface tracking-tight mt-space-xs" id="header-greeting">Hello</h1>
        </div>
        <div class="flex items-center gap-space-sm self-start sm:self-auto bg-surface-container-low px-space-md py-space-xs rounded-full">
          <span class="material-symbols-outlined text-[18px] text-outline">calendar_today</span>
          <span class="font-label-md text-label-md text-on-surface-variant font-medium" id="current-date-display"></span>
        </div>
      </div>

      <div class="bg-surface-container-lowest rounded-xl shadow-sm p-space-lg lg:p-space-xl flex flex-col gap-space-xl relative overflow-hidden">
        <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-space-lg z-10">
          <div class="flex flex-col">
            <div class="flex items-center gap-space-xs">
              <span class="font-label-sm text-label-sm text-outline font-semibold tracking-wide uppercase">Total Liquid Balance</span>
            </div>
            <div class="flex items-baseline gap-space-xs mt-space-xs">
              <span class="font-display-hero text-display-hero-mobile lg:text-display-hero text-on-surface tracking-tight font-bold" id="display-balance">$0.00</span>
            </div>
          </div>
          <div class="flex flex-wrap items-center gap-space-sm">
            <a href="transfer.html" class="px-space-lg py-3 rounded-full bg-primary hover:bg-primary-container text-on-primary font-label-md text-label-md flex items-center gap-space-sm shadow-sm transition-all active:scale-[0.98]">
              <span class="material-symbols-outlined text-[18px]">send</span>
              <span>Transfer</span>
            </a>
            <a href="chat.html" class="px-space-lg py-3 rounded-full bg-surface-container-low hover:bg-surface-container text-on-surface font-label-md text-label-md flex items-center gap-space-sm shadow-sm transition-all active:scale-[0.98]">
              <span class="material-symbols-outlined text-[18px]">support_agent</span>
              <span>Customer Care</span>
            </a>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-12 gap-space-xl items-start">
        <div class="lg:col-span-8 flex flex-col gap-space-lg">
          <div class="bg-surface-container-lowest rounded-xl shadow-sm p-space-lg lg:p-space-xl flex flex-col">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-space-md pb-space-md">
              <div>
                <h2 class="font-headline-md text-headline-md text-on-surface">Recent Transactions</h2>
              </div>
            </div>
            <div class="flex flex-col" id="transaction-list">
              <p class="text-outline py-4">Connecting to live ledger...</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<script type="module">
  import { listenToDatabaseChanges } from './app.js';

  function formatCurrency(val) {
    const num = parseFloat(val);
    if (isNaN(num)) return '$0.00';
    return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(num);
  }

  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('current-date-display').textContent = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric' });
    
    // Core Firebase Listener - Fires instantly when values are adjusted via Admin UI
    listenToDatabaseChanges((dbData) => {
      if (!dbData) return;

      // Update Financial Metrics
      document.getElementById('display-balance').textContent = formatCurrency(dbData.tb_balance);

      // Render User Profiles
      const profile = dbData.tb_profile || {};
      if (document.getElementById('header-name')) document.getElementById('header-name').textContent = profile.name || '';
      
      if (profile.checking && document.getElementById('header-account')) {
        const lastFour = profile.checking.replace(/\s+/g, '').slice(-4);
        document.getElementById('header-account').textContent = `Checking ••${lastFour}`;
      }

      const firstName = (profile.name || 'User').split(' ')[0];
      const hour = new Date().getHours();
      const greeting = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
      if (document.getElementById('header-greeting')) {
        document.getElementById('header-greeting').textContent = `${greeting}, ${firstName}`;
      }

      // Render Transaction Arrays
      const txList = document.getElementById('transaction-list');
      const txs = dbData.tb_transactions || [];
      txList.innerHTML = '';

      if (txs.length === 0) {
        txList.innerHTML = '<p class="text-outline py-4">No transactions found.</p>';
        return;
      }

      // Display up to recent 8 records
      txs.slice(0, 8).forEach(tx => {
        const isNegative = Number(tx.amount) < 0;
        const amountClass = isNegative ? 'text-on-surface' : 'text-secondary';
        const amountSign = isNegative ? '-' : '+';
        const absAmount = formatCurrency(Math.abs(Number(tx.amount)));
        let icon = 'swap_horiz';
        let iconBg = 'bg-surface-container-high';
        let iconColor = 'text-on-surface';
        if (tx.status === 'Pending') { icon = 'pending'; iconColor = 'text-amber-600'; }
        else if (tx.status === 'Blocked') { icon = 'block'; iconColor = 'text-red-600'; }
        else if (tx.type === 'incoming') { icon = 'payments'; iconBg = 'bg-secondary-container/40'; iconColor = 'text-secondary'; }
        else if (tx.type === 'card outgoing') { icon = 'shopping_cart'; }
        const statusPill = ['Pending', 'Blocked'].includes(tx.status)
          ? `<span class="text-xs px-2 py-1 bg-amber-100 text-amber-800 rounded-full ml-2">${tx.status}</span>` : '';
        txList.innerHTML += `
          <div class="transaction-row py-4 flex items-center justify-between hover:bg-surface-container-low/50 px-space-xs rounded-lg transition-colors">
            <div class="flex items-center gap-space-md min-w-0">
              <div class="w-10 h-10 rounded-full ${iconBg} flex items-center justify-center flex-shrink-0 ${iconColor}"><span class="material-symbols-outlined text-[20px]">${icon}</span></div>
              <div class="flex flex-col min-w-0">
                <span class="font-label-md text-label-md text-on-surface font-semibold truncate">${tx.payee || 'Transaction'} ${statusPill}</span>
                <div class="flex items-center gap-space-xs"><span class="font-body-sm text-body-sm text-outline">${tx.date || ''}</span>${tx.category ? `<span class="w-1 h-1 rounded-full bg-outline-variant"></span><span class="font-body-sm text-body-sm text-on-surface-variant">${tx.category}</span>` : ''}</div>
              </div>
            </div>
            <div class="flex flex-col items-end flex-shrink-0 pl-space-sm"><span class="font-headline-sm text-headline-sm ${amountClass} font-semibold tabular-nums">${amountSign}${absAmount}</span><span class="font-label-sm text-label-sm text-outline">${tx.status === 'Approved' ? 'Completed' : (tx.status || 'Unknown')}</span>${tx.note ? `<span class="text-xs text-red-500">${tx.note}</span>` : ''}</div>
          </div>`;
      });
    });
  });
</script>
</body>
</html>
