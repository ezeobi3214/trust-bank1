<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">

<script src="https://cdn.tailwindcss.com"></script>
<script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "tertiary": "#525557", "surface-container": "#e9edff", "secondary": "#006c49", "on-primary-fixed": "#00174b", "on-tertiary-container": "#eff0f2", "on-primary-fixed-variant": "#003ea8", "secondary-container": "#6cf8bb", "surface-container-high": "#e1e8fd", "on-secondary-fixed-variant": "#005236", "surface": "#f9f9ff", "on-surface-variant": "#434655", "on-secondary-container": "#00714d", "tertiary-fixed-dim": "#c5c6c8", "on-surface": "#141b2b", "on-tertiary": "#ffffff", "surface-bright": "#f9f9ff", "outline-variant": "#c3c6d7", "primary": "#004ac6", "background": "#f9f9ff", "on-background": "#141b2b", "surface-dim": "#d3daef", "on-primary": "#ffffff", "on-secondary-fixed": "#002113", "primary-fixed-dim": "#b4c5ff", "on-error": "#ffffff", "surface-container-low": "#f1f3ff", "primary-container": "#2563eb", "error-container": "#ffdad6", "tertiary-fixed": "#e1e2e4", "outline": "#737686", "surface-container-lowest": "#ffffff", "inverse-primary": "#b4c5ff", "secondary-fixed-dim": "#4edea3", "tertiary-container": "#6b6d6f", "inverse-on-surface": "#edf0ff", "surface-container-highest": "#dce2f7", "on-secondary": "#ffffff", "primary-fixed": "#dbe1ff", "secondary-fixed": "#6ffbbe", "surface-variant": "#dce2f7", "error": "#ba1a1a", "on-primary-container": "#eeefff", "on-tertiary-fixed": "#191c1e", "on-tertiary-fixed-variant": "#444749", "surface-tint": "#0053db", "on-error-container": "#93000a", "inverse-surface": "#293040" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "gutter": "1.5rem", "space-xs": "0.25rem", "space-sm": "0.5rem", "space-xl": "2rem", "margin": "2rem", "margin-mobile": "1rem", "gutter-mobile": "1rem", "space-lg": "1.5rem", "space-md": "1rem" }, "fontFamily": { "label-sm": ["Manrope"], "headline-lg": ["Manrope"], "display-hero": ["Manrope"], "label-md": ["Manrope"], "body-md": ["Manrope"], "body-lg": ["Manrope"], "display-hero-mobile": ["Manrope"], "tabular-balance": ["Manrope"], "body-sm": ["Manrope"], "headline-lg-mobile": ["Manrope"], "headline-md": ["Manrope"], "headline-sm": ["Manrope"] }, "fontSize": { "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "500" }], "headline-lg": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "600" }], "display-hero": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.03em", "fontWeight": "600" }], "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "-0.005em", "fontWeight": "500" }], "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0em", "fontWeight": "400" }], "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "-0.005em", "fontWeight": "400" }], "display-hero-mobile": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.025em", "fontWeight": "600" }], "tabular-balance": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "600" }], "body-sm": ["13px", { "lineHeight": "18px", "letterSpacing": "0em", "fontWeight": "400" }], "headline-lg-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.015em", "fontWeight": "600" }], "headline-md": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.015em", "fontWeight": "600" }], "headline-sm": ["16px", { "lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "600" }] } } } };</script>
</head>
<body class="bg-surface font-body-md text-body-md text-on-surface antialiased">
<header class="fixed top-0 w-full z-50 bg-surface-container-lowest/90 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]">
  <div class="h-20 max-w-[1200px] mx-auto px-margin-mobile lg:px-margin flex items-center justify-between gap-space-lg">
    <div class="flex items-center gap-space-xl">
      <a class="flex items-center gap-space-sm group" href="dashboard.html">
        <div class="w-9 h-9 rounded-lg bg-primary-container flex items-center justify-center">
          <span class="material-symbols-outlined text-on-primary text-[22px]">account_balance</span>
        </div>
        <span class="font-headline-sm text-headline-sm text-on-surface tracking-tight font-semibold">Trust Bank</span>
      </a>
      <nav class="hidden lg:flex items-center gap-space-xs">
        <a class="px-space-md py-space-sm rounded-lg font-label-md text-label-md text-on-surface-variant hover:text-on-surface hover:bg-surface-container-low transition-colors" href="dashboard.html">Dashboard</a>
        <a class="px-space-md py-space-sm rounded-lg font-label-md text-label-md text-on-surface-variant hover:text-on-surface hover:bg-surface-container-low transition-colors" href="transfer.html">Transfers</a>
        <a class="px-space-md py-space-sm rounded-lg font-label-md text-label-md text-on-surface-variant hover:text-on-surface hover:bg-surface-container-low transition-colors" href="#">Accounts</a>
      </nav>
    </div>
    <div class="flex items-center gap-space-md">
      <div class="flex items-center gap-space-sm pl-space-xs">
        <div class="hidden md:flex flex-col text-right">
          <span class="font-label-md text-label-md text-on-surface font-semibold leading-tight">Alex Morgan</span>
          <span class="font-label-sm text-label-sm text-outline leading-tight">Checking ••4820</span>
        </div>
        <a href="profile.html" class="w-8 h-8 rounded-full bg-primary flex items-center justify-center shadow-[0_1px_4px_rgba(0,0,0,0.06)] cursor-pointer">
          <span class="material-symbols-outlined text-on-primary text-[18px]">person</span>
        </a>
        <a href="index.html" class="ml-2 text-sm text-primary underline">Logout</a>
      </div>
    </div>
  </div>
</header>

<main class="w-full pt-20 bg-surface min-h-screen">
  <div class="flex flex-col w-full">
    <div class="max-w-[1200px] w-full mx-auto px-margin-mobile lg:px-margin py-space-xl flex flex-col gap-space-xl">
      <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-space-md">
        <div>
          <h1 class="font-display-hero text-headline-lg lg:text-display-hero text-on-surface tracking-tight mt-space-xs">Transaction History</h1>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-12 gap-space-xl items-start">
        <div class="lg:col-span-12 flex flex-col gap-space-lg">
          <div class="bg-surface-container-lowest rounded-xl shadow-sm p-space-lg lg:p-space-xl flex flex-col">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-space-md pb-space-md border-b border-surface-container-low mb-4">
              <div>
                <h2 class="font-headline-md text-headline-md text-on-surface">All Transactions</h2>
              </div>
            </div>
            <div class="flex flex-col" id="transaction-list">
              <!-- Rendered by JS -->
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<script type="module">
  import { formatCurrency, getTransactions } from './app.js';

  document.addEventListener('DOMContentLoaded', async () => {
    const txList = document.getElementById('transaction-list');
    
    async function loadTransactions() {
      const txs = await getTransactions();

      if (txs.length === 0) {
        txList.innerHTML = '<p class="text-outline py-4">No transactions found.</p>';
        return;
      }

      let newHtml = '';
      txs.forEach(tx => {
        const isNegative = tx.amount < 0;
        const amountClass = isNegative ? 'text-on-surface' : 'text-secondary';
        const amountSign = isNegative ? '-' : '+';
        const absAmount = formatCurrency(Math.abs(tx.amount));
        
        let icon = 'swap_horiz';
        let iconBg = 'bg-surface-container-high';
        let iconColor = 'text-on-surface';
        if (tx.status === 'Pending') {
          icon = 'pending';
          iconColor = 'text-amber-600';
        } else if (tx.status === 'Blocked') {
          icon = 'block';
          iconColor = 'text-red-600';
        } else if (tx.type === 'incoming') {
          icon = 'payments';
          iconBg = 'bg-secondary-container/40';
          iconColor = 'text-secondary';
        } else if (tx.type === 'card outgoing') {
          icon = 'shopping_cart';
        }

        let statusPill = '';
        if (tx.status === 'Pending') {
          statusPill = `<span class="text-xs px-2 py-1 bg-amber-100 text-amber-800 rounded-full ml-2">Pending</span>`;
        } else if (tx.status === 'Blocked') {
          statusPill = `<span class="text-xs px-2 py-1 bg-red-100 text-red-800 rounded-full ml-2">Blocked</span>`;
        }

        let actionsHtml = '';
        if (tx.status === 'Approved' && tx.amount < 0) {
          actionsHtml = `<a href="receipt.html?id=${tx.id}" class="text-xs text-primary hover:underline mt-1 inline-block">View Receipt</a>`;
        }

        newHtml += `
          <div class="transaction-row py-4 flex items-center justify-between hover:bg-surface-container-low/50 px-space-xs rounded-lg transition-colors border-b border-surface-container-lowest last:border-0">
            <div class="flex items-center gap-space-md min-w-0">
              <div class="w-10 h-10 rounded-full ${iconBg} flex items-center justify-center flex-shrink-0 ${iconColor}">
                <span class="material-symbols-outlined text-[20px]">${icon}</span>
              </div>
              <div class="flex flex-col min-w-0">
                <span class="font-label-md text-label-md text-on-surface font-semibold truncate">${tx.payee} ${statusPill}</span>
                <div class="flex items-center gap-space-xs">
                  <span class="font-body-sm text-body-sm text-outline">${tx.date}</span>
                  ${tx.category ? `<span class="w-1 h-1 rounded-full bg-outline-variant"></span><span class="font-body-sm text-body-sm text-on-surface-variant">${tx.category}</span>` : ''}
                </div>
                ${actionsHtml}
              </div>
            </div>
            <div class="flex flex-col items-end flex-shrink-0 pl-space-sm">
              <span class="font-headline-sm text-headline-sm ${amountClass} font-semibold tabular-nums">${amountSign}${absAmount}</span>
              <span class="font-label-sm text-label-sm text-outline">${tx.status === 'Approved' ? 'Completed' : (tx.status === 'Declined' ? 'Declined' : tx.status)}</span>
              ${tx.note ? `<span class="text-xs text-red-500">${tx.note}</span>` : ''}
            </div>
          </div>
        `;
      });
      txList.innerHTML = newHtml;
    }
    
    await loadTransactions();
    setInterval(loadTransactions, 5000);
  });
</script>
</body>
</html>
