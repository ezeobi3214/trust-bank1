<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trust Bank - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { 
      theme: { 
        extend: { 
          colors: { 
            "surface": "#f9f9ff", 
            "on-surface": "#141b2b", 
            "primary": "#004ac6",
            "primary-container": "#2563eb",
            "on-primary": "#ffffff",
            "surface-container-low": "#f1f3ff",
            "outline": "#737686"
          },
          fontFamily: {
            "body-md": ["Manrope"],
            "headline-lg": ["Manrope"]
          }
        } 
      } 
    };
  </script>
</head>
<body class="bg-surface font-body-md text-on-surface h-screen flex items-center justify-center antialiased">
  <div class="max-w-md w-full bg-white p-8 rounded-xl shadow-sm border border-gray-100 text-center">
    <div class="w-16 h-16 mx-auto rounded-lg bg-primary-container flex items-center justify-center mb-6">
      <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
    </div>
    <h1 class="text-2xl font-bold font-headline-lg mb-2">Welcome to Trust Bank</h1>
    <p class="text-outline mb-8">Sign in to your account</p>
    
    <form id="loginForm" class="flex flex-col gap-4 text-left">
      <div id="errorMsg" class="hidden text-red-500 text-sm mb-2 text-center">Invalid credentials</div>
      <div>
        <label class="block text-sm font-medium mb-1">Email</label>
        <input type="email" id="email" class="w-full p-3 border rounded-lg" required>
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Password</label>
        <input type="password" id="password" class="w-full p-3 border rounded-lg" required>
      </div>
      <button type="submit" class="w-full py-3 px-4 bg-primary text-white rounded-lg font-semibold hover:bg-blue-700 transition-colors mt-2">
        Login
      </button>
    </form>
  </div>
  <script src="app.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const pass = document.getElementById('password').value;
      
      const userEmail = localStorage.getItem('tb_user_email');
      const userPass = localStorage.getItem('tb_user_pass');
      const adminEmail = localStorage.getItem('tb_admin_email');
      const adminPass = localStorage.getItem('tb_admin_pass');
      
      if (email === userEmail && pass === userPass) {
        window.location.href = 'dashboard.html';
      } else if (email === adminEmail && pass === adminPass) {
        window.location.href = 'admin.html';
      } else {
        document.getElementById('errorMsg').classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
