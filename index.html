<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trust Bank - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { 
      theme: { 
        extend: { 
          colors: { 
            "surface": "#f9f9ff", 
            "on-surface": "#141b2b", 
            "primary": "#004ac6",
            "primary-container": "#2563eb",
            "on-primary": "#ffffff",
            "surface-container-low": "#f1f3ff",
            "outline": "#737686"
          },
          fontFamily: {
            "body-md": ["Manrope"],
            "headline-lg": ["Manrope"]
          }
        } 
      } 
    };
  </script>

<link rel="manifest" href="manifest.json">
</head>
<body class="bg-surface font-body-md text-on-surface h-screen flex items-center justify-center antialiased">
  <div class="max-w-md w-full bg-white p-8 rounded-xl shadow-sm border border-gray-100 text-center">
    <div class="w-16 h-16 mx-auto rounded-lg bg-primary-container flex items-center justify-center mb-6">
      <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
    </div>
    <h1 class="text-2xl font-bold font-headline-lg mb-2">Welcome to Trust Bank</h1>
    <p class="text-outline mb-8">Sign in to your account</p>
    
    <form id="loginForm" class="flex flex-col gap-4 text-left">
      <div id="errorMsg" class="hidden text-red-500 text-sm mb-2 text-center">Invalid credentials</div>
      
      <div>
        <label class="block text-sm font-semibold mb-1 text-outline">Username</label>
        <input type="text" id="emailInput" required class="w-full p-3 rounded-lg border border-gray-200 outline-none focus:border-primary">
      </div>
      
      <div>
        <label class="block text-sm font-semibold mb-1 text-outline">Password</label>
        <input type="password" id="passwordInput" required class="w-full p-3 rounded-lg border border-gray-200 outline-none focus:border-primary">
      </div>
      
      <button type="submit" class="w-full bg-primary hover:bg-primary-container text-white font-semibold p-3 rounded-lg transition mt-2">Sign In</button>
    </form>
  </div>

  <!-- FIREBASE MODULE CONNECTION -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAz1tego-FMhtuD7tGr2Cj1ZLtxdE4NTjs",
      authDomain: "apexx-ff8bc.firebaseapp.com",
      projectId: "apexx-ff8bc",
      storageBucket: "apexx-ff8bc.firebasestorage.app",
      messagingSenderId: "690467870799",
      appId: "1:690467870799:web:be7b185cb9b7349bdff23a",
      measurementId: "G-YR7YX1FMJ7"
    };

    // Initialize core services
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    
    // Set a singular global document entry for database cross-device syncing
    const dbRef = doc(db, "app_state", "global_data");

    // Static baseline parameters to configure the remote database upon its first launch
    const defaultTransactions = [
      { id: 't1', payee: 'Apple Store', date: 'Today, 10:14 AM', amount: -899.00, type: 'card outgoing', status: 'Approved', category: 'Hardware', createdAt: Date.now() - 10000000 },
      { id: 't2', payee: 'Payroll Direct Deposit', date: 'Yesterday', amount: 4250.00, type: 'incoming', status: 'Approved', category: 'Acme Corp', createdAt: Date.now() - 20000000 },
      { id: 't3', payee: 'Whole Foods Market', date: 'Oct 22, 2025', amount: -84.20, type: 'card outgoing', status: 'Approved', category: 'Groceries', createdAt: Date.now() - 30000000 }
    ];
    const defaultProfile = {
      name: 'Alex Morgan', dob: 'March 14, 1991', email: 'alex.morgan@domain.com', phone: '+1 (555) 234-8901',
      address: '742 Evergreen Terrace, Suite 400, San Francisco, CA 94107', checking: '0923 8491 4820', routing: '121000358', savings: '3847 2910 9104'
    };

    // Auto-populates Firebase collection when the project runs for the first time
    async function initFirebaseState() {
      try {
        const docSnap = await getDoc(dbRef);
        if (!docSnap.exists()) {
          await setDoc(dbRef, {
            tb_balance: '24850.40',
            tb_transferLimit: '5000.00',
            tb_transactions: defaultTransactions,
            tb_profile: defaultProfile,
            tb_messages: [],
            tb_user_email: 'user@com',
            tb_user_pass: '11111',
            tb_admin_email: 'admin@com',
            tb_admin_pass: '00000'
          });
          console.log("Firebase initialized successfully with default records.");
        }
      } catch (e) { 
        console.error("Firebase setup warning:", e); 
      }
    }
    initFirebaseState();

    // Verify submission against online Firebase document
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('emailInput').value;
      const pass = document.getElementById('passwordInput').value;
      const errorMsg = document.getElementById('errorMsg');

      try {
        const docSnap = await getDoc(dbRef);
        if (docSnap.exists()) {
          const data = docSnap.data();
          
          if (email === data.tb_admin_email && pass === data.tb_admin_pass) {
            window.location.href = 'admin.html';
          } else if (email === data.tb_user_email && pass === data.tb_user_pass) {
            window.location.href = 'dashboard.html';
          } else {
            errorMsg.classList.remove('hidden');
          }
        }
      } catch (err) {
        console.error("Connection failure:", err);
        alert("Unable to process request. Check internet access or Firebase rules setup.");
      }
    });
  </script>

<div id="google_translate_element" style="position:fixed; bottom:20px; right:20px; z-index:9999;"></div>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').then(registration => {
        console.log('ServiceWorker registration successful');
      }).catch(err => {
        console.log('ServiceWorker registration failed: ', err);
      });
    });
  }
</script>

</body>
</html>
