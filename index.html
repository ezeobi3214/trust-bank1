<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trust Bank - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@400,0..1&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { 
      theme: { 
        extend: { 
          colors: { 
            "surface": "#f9f9ff", 
            "on-surface": "#141b2b", 
            "primary": "#004ac6",
            "primary-container": "#2563eb",
            "on-primary": "#ffffff",
            "surface-container-low": "#f1f3ff",
            "outline": "#737686"
          },
          fontFamily: {
            "body-md": ["Manrope"],
            "headline-lg": ["Manrope"]
          }
        } 
      } 
    };
  </script>

  <link rel="manifest" href="manifest.json">
</head>
<body class="bg-surface font-body-md text-on-surface min-h-screen flex items-center justify-center p-4 antialiased">
  <div class="max-w-md w-full bg-white p-8 rounded-2xl shadow-lg border border-gray-100 text-center relative">
    <div class="w-16 h-16 mx-auto rounded-xl bg-primary-container flex items-center justify-center mb-6 shadow-md shadow-blue-500/20">
      <span class="material-symbols-outlined text-white text-[32px] notranslate" translate="no">account_balance</span>
    </div>
    <h1 class="text-2xl font-bold font-headline-lg mb-2 text-on-surface">Welcome to Trust Bank</h1>
    <p class="text-outline mb-6 text-sm">Sign in securely to your account</p>
    
    <form id="loginForm" class="flex flex-col gap-4 text-left">
      <div id="errorMsg" class="hidden text-red-600 text-sm p-3 bg-red-50 border border-red-200 rounded-lg text-center font-medium">Invalid credentials. Please try again.</div>
      
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider mb-1.5 text-outline">Username or Email</label>
        <div class="relative">
          <input type="text" id="emailInput" required autocomplete="username" placeholder="e.g. @trustbank25" class="w-full pl-10 pr-4 py-3 rounded-lg border border-gray-200 outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 text-on-surface font-medium transition">
          <span class="material-symbols-outlined absolute left-3 top-3.5 text-gray-400 text-[20px] notranslate" translate="no">person</span>
        </div>
      </div>
      
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider mb-1.5 text-outline">Password</label>
        <div class="relative">
          <input type="password" id="passwordInput" required autocomplete="current-password" placeholder="••••••••" class="w-full pl-10 pr-4 py-3 rounded-lg border border-gray-200 outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 text-on-surface font-medium transition">
          <span class="material-symbols-outlined absolute left-3 top-3.5 text-gray-400 text-[20px] notranslate" translate="no">lock</span>
        </div>
      </div>
      
      <button type="submit" id="submitBtn" class="w-full bg-primary hover:bg-primary-container text-white font-semibold py-3.5 px-4 rounded-xl shadow-md shadow-primary/25 transition-all active:scale-[0.98] mt-2 flex items-center justify-center gap-2">
        <span>Sign In</span>
        <span class="material-symbols-outlined text-[18px] notranslate" translate="no">arrow_forward</span>
      </button>
    </form>

    <div class="mt-6 pt-6 border-t border-gray-100 flex items-center justify-between text-xs text-outline">
      <span>Trust Bank Online</span>
      <span class="flex items-center gap-1 text-green-600 font-medium">
        <span class="material-symbols-outlined text-[14px] notranslate" translate="no">verified_user</span> 256-bit SSL Encrypted
      </span>
    </div>
  </div>

  <!-- FIREBASE & AUTH LOGIC -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
    import { initializeState, getAllAccounts, setCurrentAccountId } from './app.js';

    await initializeState();

    const form = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const errorMsg = document.getElementById('errorMsg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('emailInput').value.trim();
      const pass = document.getElementById('passwordInput').value.trim();

      errorMsg.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[18px] notranslate" translate="no">sync</span><span>Verifying...</span>';

      try {
        const accounts = await getAllAccounts();
        const firebaseConfig = {
          apiKey: "AIzaSyAz1tego-FMhtuD7tGr2Cj1ZLtxdE4NTjs",
          authDomain: "apexx-ff8bc.firebaseapp.com",
          projectId: "apexx-ff8bc",
          storageBucket: "apexx-ff8bc.firebasestorage.app",
          messagingSenderId: "690467870799",
          appId: "1:690467870799:web:be7b185cb9b7349bdff23a",
          measurementId: "G-YR7YX1FMJ7"
        };
        const app = initializeApp(firebaseConfig, "authCheck_" + Date.now());
        const db = getFirestore(app);
        const docSnap = await getDoc(doc(db, "app_state", "global_data"));
        const data = docSnap.exists() ? docSnap.data() : {};

        const adminEmail = (data.tb_admin_email || 'admin@com').trim().toLowerCase();
        const adminPass = (data.tb_admin_pass || '00000').trim();

        // 1. Admin Login
        if (email.toLowerCase() === adminEmail && pass === adminPass) {
          window.location.href = 'admin.html';
          return;
        }

        // 2. Account 1 Login (matches account1 email OR legacy tb_user_email)
        const acc1 = accounts.account1 || {};
        const acc1Email = (acc1.email || data.tb_user_email || '').trim().toLowerCase();
        const acc1Pass = (acc1.password || data.tb_user_pass || '').trim();

        if (email.toLowerCase() === acc1Email && pass === acc1Pass) {
          setCurrentAccountId('account1');
          window.location.href = 'dashboard.html';
          return;
        }

        // 3. Account 2 Login
        const acc2 = accounts.account2 || {};
        const acc2Email = (acc2.email || '@trustbank26').trim().toLowerCase();
        const acc2Pass = (acc2.password || '222653').trim();

        if (email.toLowerCase() === acc2Email && pass === acc2Pass) {
          setCurrentAccountId('account2');
          window.location.href = 'dashboard.html';
          return;
        }

        // If credentials failed:
        errorMsg.textContent = "Invalid credentials. Please verify your login details.";
        errorMsg.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Sign In</span><span class="material-symbols-outlined text-[18px] notranslate" translate="no">arrow_forward</span>';

      } catch (err) {
        console.error("Sign-in failure:", err);
        errorMsg.textContent = "Unable to process request. Please check your network.";
        errorMsg.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Sign In</span><span class="material-symbols-outlined text-[18px] notranslate" translate="no">arrow_forward</span>';
      }
    });
  </script>

  <!-- Moveable Translation Widget -->
  <script src="translate.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => {
          console.log('ServiceWorker registration error: ', err);
        });
      });
    }
  </script>
</body>
</html>
